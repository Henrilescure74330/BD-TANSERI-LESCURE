<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Une BD animée pour un ami. Accès protégé par mot de passe.">
<meta property="og:title" content="🥊 Le Cador d'Annecy : une BD animée rien que pour toi">
<meta property="og:description" content="Accès réservé. Le mot de passe, tu le connais.">
<meta property="og:type" content="website">
<title>Le Cador d'Annecy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Dancing+Script:wght@700&family=Nunito:wght@400;700;800&family=Amiri:wght@700&display=swap" rel="stylesheet">
<style>/* Mise en page : une colonne de planches BD sur fond bitume, accents or (triangle d'or) et turquoise (lac). Look sombre assumé. */
:root{
  --bitume:#17151c; --bitume-2:#221f2a; --craie:#f3eee6; --encre:#1c1c1f;
  --or:#f2b631; --lac:#36c2c9; --rose:#e2557a; --papier:#fff8e6;
  --f-titre:"Permanent Marker", "Marker Felt", cursive;
  --f-sfx:Bangers, Impact, sans-serif;
  --f-texte:Nunito, system-ui, sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bitume);color:var(--craie);font:16px/1.5 var(--f-texte);overflow-x:hidden;
  background-image:radial-gradient(rgba(255,255,255,.035) 1px,transparent 1px);background-size:5px 5px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- Porte d'entrée ---------- */
.porte{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding-block:32px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(circle at 50% 30%,#3a1c22 0,#17151c 60%)}
.porte-boite{width:100%;max-width:420px;text-align:center}
.porte-tag{display:inline-block;font:800 12px var(--f-texte);letter-spacing:.18em;text-transform:uppercase;color:var(--encre);background:var(--or);padding:4px 10px;transform:rotate(-2deg)}
.porte-titre{font-family:var(--f-titre);font-weight:400;font-size:clamp(52px,16vw,84px);line-height:.95;margin:18px 0 10px;color:var(--craie);
  text-shadow:4px 4px 0 #b3261e,8px 8px 0 rgba(0,0,0,.5);transform:rotate(-3deg)}
.porte-txt{opacity:.85;margin:0 0 20px}
#form-mdp{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
#mdp{font:800 18px var(--f-texte);padding:12px 16px;border-radius:999px;border:3px solid var(--craie);background:#0e0d12;color:var(--craie);width:min(240px,100%);text-align:center}
#mdp:focus{outline:3px solid var(--or);outline-offset:2px}
.porte-boite.secoue{animation:secoue .45s}
@keyframes secoue{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.erreur{color:#ff8a7a;font-weight:800;margin:14px 0 0}
.son-porte{margin-top:22px;background:none;border:2px dashed rgba(243,238,230,.4);color:var(--craie);border-radius:999px;padding:8px 16px;font:700 14px var(--f-texte);cursor:pointer}
.son-porte:focus-visible{outline:3px solid var(--or)}

.btn{font:800 16px var(--f-texte);border:3px solid var(--encre);border-radius:999px;padding:12px 22px;cursor:pointer;background:var(--or);color:var(--encre);box-shadow:4px 4px 0 #000}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #000}
.btn:focus-visible{outline:3px solid var(--lac);outline-offset:3px}

/* ---------- BD ---------- */
main{max-width:720px;margin:0 auto;padding-block:0 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.entete{text-align:center;padding:40px 0 6px}
.tome{font:800 12px var(--f-texte);letter-spacing:.2em;text-transform:uppercase;color:var(--lac)}
.entete h1{font-family:var(--f-sfx);font-weight:400;font-size:clamp(84px,26vw,150px);line-height:.85;margin:10px 0 0;color:var(--or);letter-spacing:.04em;
  -webkit-text-stroke:3px var(--encre);text-shadow:6px 6px 0 #b3261e}
.sous-titre{font-family:var(--f-titre);font-size:clamp(22px,6vw,32px);transform:rotate(-2deg);margin-top:4px}
.chapo{max-width:56ch;margin:16px auto 0;opacity:.85;font-size:15px;text-wrap:balance}
.planche{margin:34px 0;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
.anim .planche:not(.vu){transform:translateY(30px) scale(.98)}
.recit{background:var(--papier);color:var(--encre);border:3px solid var(--encre);padding:8px 12px;font-weight:700;font-size:15px;margin:0 0 12px;box-shadow:4px 4px 0 var(--or);display:inline-block}
.recit b{font-family:var(--f-sfx);font-weight:400;letter-spacing:.05em;color:#b3261e;font-size:19px;margin-right:8px}
.case{position:relative;border:4px solid var(--craie);border-radius:4px;background:#fff;overflow:hidden;box-shadow:7px 7px 0 #000}
.case svg{display:block;width:100%;height:auto}
.bulle{position:absolute;background:#fff;color:var(--encre);border:2.5px solid var(--encre);border-radius:18px;padding:6px 10px;
  font-weight:800;font-size:clamp(10.5px,3vw,15px);line-height:1.25;max-width:46%;transition:opacity .45s,transform .5s cubic-bezier(.3,1.6,.5,1);transition-delay:.4s}
.bulle b{color:#b3261e}
.anim .planche:not(.vu) .bulle{opacity:0;transform:scale(.4)}
.bulle.b2{transition-delay:1.5s}.bulle.b3{transition-delay:2.6s}
.bulle::after{content:"";position:absolute;width:13px;height:13px;background:#fff;border:2.5px solid var(--encre);border-top:0;border-left:0;transform:rotate(45deg)}
.bulle.bas::after{bottom:-8.5px;left:24px}
.bulle.bas-d::after{bottom:-8.5px;right:24px}
.bulle.haut::after{top:-8.5px;left:24px;transform:rotate(225deg)}
.bulle.haut-g::after{top:-8.5px;right:24px;transform:rotate(225deg)}

/* ---------- animations SVG ---------- */
.nuage{animation:derive 28s linear infinite}.nuage.l{animation-duration:42s;animation-direction:reverse}
@keyframes derive{from{transform:translateX(-120px)}to{transform:translateX(460px)}}
.etincelle,.pop,.pulse{transform-box:fill-box;transform-origin:center}
.etincelle{animation:scint 1.4s ease-in-out infinite}
@keyframes scint{0%,100%{transform:scale(.2) rotate(0);opacity:.2}50%{transform:scale(1) rotate(45deg);opacity:1}}
.yeux{transform-box:fill-box;transform-origin:center;animation:cligne 4.5s infinite}
@keyframes cligne{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
.tourne{transform-box:fill-box;transform-origin:center;animation:tour 3s linear infinite}
.tourne.vite{animation-duration:1.2s}.tourne.lent{animation-duration:30s}
@keyframes tour{to{transform:rotate(360deg)}}
.pop{animation:pop 1.2s ease-in-out infinite}
@keyframes pop{0%,100%{transform:scale(1) rotate(-3deg)}50%{transform:scale(1.18) rotate(3deg)}}
.vapeur{animation:vapeur 2.6s ease-in-out infinite}
@keyframes vapeur{0%{transform:translateY(6px);opacity:0}40%{opacity:1}100%{transform:translateY(-14px);opacity:0}}
.balance{transform-box:fill-box;transform-origin:top left;animation:balance 3s ease-in-out infinite}
@keyframes balance{50%{transform:rotate(1.5deg)}}
.drapeau{transform-box:fill-box;transform-origin:left center;animation:drapeau 1s ease-in-out infinite alternate}
@keyframes drapeau{to{transform:skewY(6deg) scaleX(.92)}}
.poteau{animation:poteau 1.2s linear infinite}
@keyframes poteau{to{transform:translateY(32px)}}
.tondeuse{animation:tondeuse .12s linear infinite alternate}
@keyframes tondeuse{to{transform:translate(2px,-2px)}}
.clignote{animation:clignote .8s steps(2) infinite}
@keyframes clignote{50%{opacity:.2}}
.defile{animation:defile 4s linear infinite}.defile.vite{animation-duration:1.4s}
@keyframes defile{to{transform:translateX(-120px)}}
.defile.vite{animation-name:defile2}@keyframes defile2{to{transform:translateX(-70px)}}
.vitesse{animation:vitesse .5s linear infinite}
@keyframes vitesse{from{transform:translateX(30px);opacity:0}50%{opacity:.9}to{transform:translateX(-30px);opacity:0}}
.sac{transform-box:view-box;transform-origin:0 0;animation:sac .9s ease-out infinite}
@keyframes sac{0%,30%{transform:rotate(0)}45%{transform:rotate(-12deg)}75%{transform:rotate(5deg)}100%{transform:rotate(0)}}
.laser{transform-box:view-box;transform-origin:200px 0;animation:laser 2.4s ease-in-out infinite alternate}
@keyframes laser{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
.dalle{animation:dalle 1s steps(2) infinite}
@keyframes dalle{50%{opacity:.85}}
.pulse{animation:pulse .68s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.note{animation:note 3s ease-in infinite}
@keyframes note{from{transform:translateY(0);opacity:1}to{transform:translateY(-80px);opacity:0}}
.nage{animation:nage 6s linear infinite}
@keyframes nage{from{transform:translateX(-60px)}to{transform:translateX(140px)}}
.vague{animation:vague 3s linear infinite}
@keyframes vague{to{transform:translateX(-60px)}}
.flotte{animation:flotte 2.4s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(5px)}}
.poisson{animation:poisson 5s ease-in-out infinite}
@keyframes poisson{0%,100%{transform:translate(250px,270px)}50%{transform:translate(330px,262px)}}
.flux path{animation:flux 1s linear infinite}
@keyframes flux{to{stroke-dashoffset:-28}}
.tombe{animation:tombe 3s linear infinite}
@keyframes tombe{from{transform:translateY(-40px) rotate(0)}to{transform:translateY(260px) rotate(360deg)}}
.flamme{transform-box:fill-box;transform-origin:bottom;animation:flamme .35s ease-in-out infinite alternate}
@keyframes flamme{to{transform:scaleY(1.3) skewX(6deg)}}
.coeur{animation:coeur 2.6s ease-in infinite}
@keyframes coeur{from{transform:translateY(0);opacity:1}to{transform:translateY(-70px);opacity:0}}
.oiseau{animation:vole 10s linear infinite}
@keyframes vole{from{transform:translate(-40px,0)}50%{transform:translate(200px,-30px)}to{transform:translate(440px,0)}}

/* ---------- fin + album ---------- */
.fin{text-align:center;background:var(--papier);color:var(--encre);border:4px solid var(--encre);box-shadow:7px 7px 0 var(--or);padding:24px 18px;margin-top:40px}
.fin-titre{font-family:var(--f-sfx);font-size:clamp(30px,8vw,46px);line-height:1;color:#b3261e;letter-spacing:.03em}
.arabe{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:clamp(30px,8vw,42px);color:#1f7a6e;margin:8px 0}
.fin p{max-width:52ch;margin:10px auto}
.signe{font-family:"Dancing Script",cursive;font-size:28px;font-weight:700}
.album{margin-top:44px;text-align:center}
.album-titre{font-family:var(--f-titre);font-size:28px;transform:rotate(-2deg);margin-bottom:18px}
.polas{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.pola{margin:0;background:#fff;padding:8px 8px 10px;box-shadow:0 6px 18px rgba(0,0,0,.5);transform:rotate(var(--r))}
.pola img{display:block;width:100%;aspect-ratio:1;object-fit:cover}
.pola figcaption{font-family:"Permanent Marker",cursive;color:var(--encre);font-size:13px;margin-top:6px}

.musique{position:fixed;z-index:10;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:10px;
  background:var(--craie);color:var(--encre);border:3px solid var(--encre);border-radius:999px;padding:8px 18px 8px 8px;font:800 15px var(--f-texte);box-shadow:4px 4px 0 #000;cursor:pointer;white-space:nowrap}
.musique .ic{width:32px;height:32px;border-radius:50%;background:var(--rose);color:#fff;display:grid;place-items:center;font-size:16px}
.musique.on .ic{animation:pulse .68s ease-in-out infinite}
.confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:20;pointer-events:none;animation:conf 2.6s ease-in forwards}
@keyframes conf{to{transform:translate(var(--dx),105vh) rotate(900deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="porte" class="porte">
  <div class="porte-boite">
    <div class="porte-tag">Dossier classé · Niveau cador</div>
    <h1 class="porte-titre">ACCÈS<br>RÉSERVÉ</h1>
    <p class="porte-txt">Une BD animée pour un ami. Entre le mot de passe pour l'ouvrir.</p>
    <form id="form-mdp" autocomplete="off">
      <label for="mdp" class="sr">Mot de passe</label>
      <input id="mdp" type="password" placeholder="Mot de passe" autocapitalize="none" autocorrect="off" spellcheck="false">
      <button class="btn" type="submit">Entrer</button>
    </form>
    <p id="erreur" class="erreur" hidden>Mauvais mot de passe. Réessaie, champion.</p>
    <button id="son-porte" class="son-porte" type="button">🔊 Lancer l'ambiance</button>
  </div>
</div>
<main id="bd" hidden></main>
<button id="musique" class="musique" type="button" hidden><span class="ic">♪</span><span id="musique-txt">Couper le son</span></button>

<script>/* Deux instrus originales, 100 % générées par le navigateur (Web Audio) :

<script>(function () {

  var coupe = false;

  function b64(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }

  // Ambiance de la porte : démarre au premier geste (exigence des navigateurs)

  });
  function majSon() {

    sonPorte.textContent = on ? '🔇 Couper l\'ambiance' : '🔊 Lancer l\'ambiance';
    btxt.textContent = on ? 'Couper le son' : 'Mettre le son';
    bouton.classList.toggle('on', on);
  }

  form.addEventListener('submit', async function (e) {
    e.preventDefault();

    }
  }

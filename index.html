<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Les Tanseri-Lescure</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@800&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
:root{--paper:#f5eee1;--ink:#3e2c22;--rose:#d9665e;--soft:#7a6252;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper) radial-gradient(ellipse at 30% 0%,rgba(240,178,87,.25),transparent 60%);color:var(--ink);font-family:"Zen Maru Gothic",system-ui,sans-serif;padding:24px 16px}
form{width:100%;max-width:360px;background:#fffdf8;border:3px solid var(--ink);border-radius:6px;box-shadow:4px 5px 0 rgba(62,44,34,.18);padding:26px 22px;text-align:center}
h1{font-family:"Shippori Mincho B1",Georgia,serif;font-weight:800;font-size:30px;line-height:1.05;margin:0 0 6px}
p{margin:0 0 18px;color:var(--soft);font-size:15px}
label{display:block;text-align:left;font-weight:700;font-size:14px;margin-bottom:6px}
input{width:100%;font:inherit;font-size:18px;padding:10px 12px;border:2px solid var(--ink);border-radius:6px;background:#fff}
input:focus{outline:3px solid var(--rose);outline-offset:1px}
button{margin-top:14px;width:100%;font:inherit;font-weight:700;font-size:17px;padding:11px;border:2px solid var(--ink);border-radius:999px;background:var(--rose);color:#fff;cursor:pointer}
.err{min-height:1.4em;margin-top:10px;color:#b23b33;font-size:14px}
</style>
</head>
<body>
<form id="f">
<h1>Les Tanseri&#8209;Lescure</h1>
<p>Une BD réservée à la famille.</p>
<label for="pw">Mot de passe</label>
<input id="pw" type="password" autocomplete="current-password" autofocus required>
<button type="submit">Ouvrir la BD</button>
<div class="err" id="err" role="alert"></div>
</form>

const u=s=>Uint8Array.from(atob(s),ch=>ch.charCodeAt(0));
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:600000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},key,u(D.c));
  return new TextDecoder().decode(pt);
}
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();const err=document.getElementById('err');err.textContent='Ouverture…';
  try{const html=await open(document.getElementById('pw').value.trim());document.open();document.write(html);document.close();}
  catch(_){err.textContent='Mot de passe incorrect, réessayez.';}
});
